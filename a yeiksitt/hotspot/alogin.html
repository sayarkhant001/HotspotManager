<!DOCTYPE html>
<html lang="my">
<head>
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
  <meta http-equiv="refresh" content="2; url=$(link-redirect)" />
  <title>A Yeik Sitt WiFi – ချိတ်ဆက်မှု အောင်မြင်ပါသည်</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <link rel="icon" type="image/x-icon" href="img/favicon.ico" />
  <link rel="stylesheet" href="css/style.css" />
  <script>
    var un = "$(username)";
    if (un && un.length > 0) {
      try {
        localStorage.setItem("ayeiksitt_wifi_voucher", un);
        localStorage.setItem("ayeiksitt_wifi_voucher_time", Date.now().toString());
      } catch(e){}
    }
    setTimeout(function() {
      window.location.href = "$(link-redirect)" || "http://10.10.10.1/status";
    }, 1500);
  </script>
</head>
<body>
  <div class="bg-ambient">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
  </div>

  <div class="portal-container">
    <div class="glass-card" style="text-align: center;">
      <div class="kid-avatar-wrap" style="width: 90px; height: 90px;">
        <img src="img/avatar.jpg" alt="A Yeik Sitt WiFi" class="kid-avatar-img" />
      </div>

      <h1 class="brand-title" style="font-size: 21px;">A Yeik Sitt WiFi</h1>
      <p class="brand-sub" style="color: #34D399;">
        ✓ အင်တာနက် ချိတ်ဆက်မှု အောင်မြင်ပါသည်
      </p>

      <p style="font-size: 13px; color: var(--text-muted); margin-bottom: 16px;">
        ခေတ္တစောင့်ဆိုင်းပါ... စက္ကန့်အနည်းငယ်အတွင်း ဝက်ဘ်ဆိုဒ်သို့ ရောက်ရှိပါမည်။
      </p>

      <a href="$(link-redirect)" class="btn-connect" style="text-decoration: none;">
        <span>🌐 အင်တာနက် စတင်အသုံးပြုမည်</span>
      </a>

      <p class="footer-copy">
        A Yeik Sitt WiFi &bull; အရိပ်စစ် ဝိုင်ဖိုင်
      </p>
    </div>
  </div>
</body>
</html>
