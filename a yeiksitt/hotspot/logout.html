<!DOCTYPE html>
<html lang="my">
<head>
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
  <title>A Yeik Sitt WiFi – အင်တာနက် အဆက်အသွယ်ဖြတ်ပြီးပါပြီ</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <link rel="icon" type="image/x-icon" href="img/favicon.ico" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="bg-ambient">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
  </div>

  <div class="portal-container">
    <div class="glass-card" style="text-align: center;">
      <div class="kid-avatar-wrap" style="width: 90px; height: 90px;">
        <img src="img/avatar.jpg" alt="A Yeik Sitt WiFi" class="kid-avatar-img" />
      </div>

      <h1 class="brand-title" style="font-size: 21px;">A Yeik Sitt WiFi</h1>
      <p class="brand-sub" style="color: #F87171;">
        အင်တာနက် အဆက်အသွယ် ဖြတ်ပြီးပါပြီ
      </p>

      <div style="background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08); border-radius: 14px; padding: 14px; margin-bottom: 18px; text-align: left; font-size: 13px; line-height: 1.6;">
        <div>အသုံးပြုသူ: <strong style="color:#FFF;">$(username)</strong></div>
        <div>သုံးစွဲချိန်: <strong style="color:#34D399;">$(uptime)</strong></div>
        <div>ဒေတာသုံးစွဲမှု: <strong style="color:#38BDF8;">$(bytes-in-nice) / $(bytes-out-nice)</strong></div>
      </div>

      <a href="http://10.10.10.1/login" class="btn-connect" style="text-decoration: none;">
        <span>🔄 ပြန်လည် ချိတ်ဆက်မည်</span>
      </a>

      <p class="footer-copy">
        A Yeik Sitt WiFi &bull; အရိပ်စစ် ဝိုင်ဖိုင်ကို အသုံးပြုသည့်အတွက် ကျေးဇူးတင်ပါသည်
      </p>
    </div>
  </div>
</body>
</html>
