<!DOCTYPE html>
<html lang="my">
<head>
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
  <title>A Yeik Sitt WiFi – အမှားဖြစ်ပေါ်ပါသည်</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <link rel="icon" type="image/x-icon" href="img/favicon.ico" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="bg-ambient">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
  </div>

  <div class="portal-container">
    <div class="glass-card" style="text-align: center;">
      <div class="kid-avatar-wrap" style="width: 85px; height: 85px;">
        <img src="img/avatar.jpg" alt="A Yeik Sitt WiFi" class="kid-avatar-img" />
      </div>

      <h1 class="brand-title" style="font-size: 20px;">A Yeik Sitt WiFi</h1>
      <p class="brand-sub" style="color: #EF4444;">
        ⚠️ ချိတ်ဆက်မှု မအောင်မြင်ပါ
      </p>

      <div class="msg-alert" style="display:block; margin: 16px 0;">
        $(if error)
          <strong>$(error)</strong>
        $(else)
          ဘောင်ချာကုဒ် မှားယွင်းနေပါသည် သို့မဟုတ် အသုံးပြုခွင့် သက်တမ်းကုန်ဆုံးသွားပါပြီ။
        $(endif)
      </div>

      <a href="http://10.10.10.1/login" class="btn-connect" style="text-decoration: none;">
        <span>🔄 ပြန်လည် ကြိုးစားမည်</span>
      </a>

      <p class="footer-copy">
        A Yeik Sitt WiFi &bull; အရိပ်စစ် ဝိုင်ဖိုင်
      </p>
    </div>
  </div>
</body>
</html>
