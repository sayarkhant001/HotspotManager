<!DOCTYPE html>
<html lang="my">
<head>
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
  <title>အရိပ်စစ် Wifi – အင်တာနက် ချိတ်ဆက်နေပါသည်...</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta http-equiv="refresh" content="2; url=$(link-status)" />
  <link rel="icon" type="image/jpeg" href="img/ayeiksitt.jpg" />
  <link rel="stylesheet" href="css/style.css" />
  <script>
    function startRedirect() {
      window.location.href = "$(link-status)";
    }
  </script>
</head>
<body onload="startRedirect()">

  <!-- Sweet Pastel Ambient Background -->
  <div class="warm-bg" aria-hidden="true">
    <div class="sun-bubble bubble-1"></div>
    <div class="sun-bubble bubble-2"></div>
  </div>

  <div class="portal-wrapper">
    <div class="portal-card" style="text-align: center;">

      <!-- Baby Hero Section -->
      <div class="hero-kid-section">
        <div class="avatar-outer-ring" style="width: 104px; height: 104px; background: linear-gradient(135deg, #10B981, #34D399, #FBBF24);">
          <div class="avatar-inner-frame">
            <img src="img/ayeiksitt.jpg" alt="အရိပ်စစ်လေး" class="kid-photo" />
          </div>
          <div class="kid-badge-tag" style="background:#ECFDF5; border-color:#34D399; color:#065F46;">
            <span>🎉</span>
            <span>အောင်မြင်ပါသည်</span>
          </div>
        </div>

        <h1 class="brand-title" style="font-size: 21px;">ချိတ်ဆက်မှု အောင်မြင်ပါသည်</h1>
        <p class="brand-greeting" style="color:#059669; font-weight:600;">အင်တာနက် အသုံးပြုနိုင်ပါပြီ...</p>
      </div>

      <!-- Animated Progress Bar -->
      <div style="background: #FFF0E0; border-radius: 100px; height: 6px; overflow: hidden; margin: 18px 0;">
        <div style="height: 100%; width: 100%; background: linear-gradient(90deg, #FF6B4A, #FFA834); border-radius: 100px; animation: progressSlide 1.5s ease-in-out infinite;"></div>
      </div>

      <style>
        @keyframes progressSlide {
          0% { transform: translateX(-100%); }
          100% { transform: translateX(100%); }
        }
      </style>

      <a href="$(link-status)" class="btn-connect" style="text-decoration:none;">
        <span>ဆက်လက် အသုံးပြုမည်</span>
      </a>

      <!-- Footer Copy -->
      <p class="footer-text">
        ❤️ မေတ္တာဖြင့် ဝန်ဆောင်မှုပေးပါသည် • အရိပ်စစ် Wifi
      </p>

    </div>
  </div>

</body>
</html>
