<!DOCTYPE html>
<html lang="my">
<head>
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
  <title>အရိပ်စစ် Wifi – အမှားအယွင်း ဖြစ်ပေါ်ပါသည်</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <link rel="icon" type="image/jpeg" href="img/ayeiksitt.jpg" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- Sweet Pastel Ambient Background -->
  <div class="warm-bg" aria-hidden="true">
    <div class="sun-bubble bubble-1"></div>
    <div class="sun-bubble bubble-2"></div>
  </div>

  <div class="portal-wrapper">
    <div class="portal-card" style="text-align: center;">

      <!-- Baby Hero Section -->
      <div class="hero-kid-section">
        <div class="avatar-outer-ring" style="width: 104px; height: 104px; background: linear-gradient(135deg, #F87171, #FBBF24);">
          <div class="avatar-inner-frame">
            <img src="img/ayeiksitt.jpg" alt="အရိပ်စစ်လေး" class="kid-photo" />
          </div>
          <div class="kid-badge-tag" style="background:#FEF2F2; border-color:#FCA5A5; color:#991B1B;">
            <span>⚠️</span>
            <span>သတိပြုရန်</span>
          </div>
        </div>

        <h1 class="brand-title" style="font-size: 21px;">ခေတ္တ စစ်ဆေးပါ</h1>
        <p class="brand-greeting">ဘောင်ချာကုဒ် သို့မဟုတ် အကောင့် အဆင်မပြေပါ</p>
      </div>

      <!-- Error Message Card -->
      <div class="alert-box" style="margin-bottom: 20px; justify-content: center; text-align: left;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" style="flex-shrink:0;">
          <circle cx="12" cy="12" r="10"/>
          <line x1="12" y1="8" x2="12"/>
          <line x1="12" y1="16" x2="12.01" y2="16"/>
        </svg>
        <span id="err_text">$(error)</span>
      </div>

      <form action="$(link-login)" method="get">
        <button class="btn-connect" type="submit">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6">
            <polyline points="1 4 1 10 7 10"/>
            <path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/>
          </svg>
          <span>ပြန်လည် ကြိုးစားမည် (Try Again)</span>
        </button>
      </form>

      <!-- Footer Copy -->
      <p class="footer-text">
        ❤️ မေတ္တာဖြင့် ဝန်ဆောင်မှုပေးပါသည် • အရိပ်စစ် Wifi
      </p>

    </div>
  </div>

  <script>
    (function () {
      try {
        localStorage.removeItem('ayeiksitt1_voucher');
        localStorage.removeItem('ayeiksitt1_voucher_time');
        localStorage.removeItem('ayeiksitt1_auth_type');
      } catch (e) {}

      var el = document.getElementById('err_text');
      if (!el) return;
      var raw = (el.textContent || el.innerText || '').trim();
      var lower = raw.toLowerCase();
      if (!raw || raw.indexOf('$(') !== -1) {
        el.textContent = 'ဘောင်ချာကုဒ် သို့မဟုတ် အကောင့် အဆင်မပြေပါ';
        return;
      }
      if (lower.indexOf('traffic limit') !== -1 || lower.indexOf('transfer limit') !== -1) {
        el.textContent = 'ဒေတာ ကုန်သွားပါပြီ (Data Quota Reached) – ကျေးဇူးပြု၍ ဘောင်ချာအသစ် ဝယ်ယူသုံးစွဲပါ';
      } else if (lower.indexOf('uptime limit') !== -1 || lower.indexOf('session limit') !== -1) {
        el.textContent = 'ဘောင်ချာ သက်တမ်းကုန်သွားပါပြီ (Validity Expired) – ကျေးဇူးပြု၍ ဘောင်ချာအသစ် ဝယ်ယူသုံးစွဲပါ';
      } else if (lower.indexOf('disabled') !== -1) {
        el.textContent = 'ဘောင်ချာ သက်တမ်း (သို့) ဒေတာ ကုန်ဆုံးသွားပါပြီ (Expired or Quota Reached) – ကျေးဇူးပြု၍ ဘောင်ချာအသစ် ဝယ်ယူသုံးစွဲပါ';
      } else if (lower.indexOf('already logged in') !== -1 || lower.indexOf('simultaneous') !== -1) {
        el.textContent = 'ဤဘောင်ချာကုဒ်သည် အခြားဖုန်းတွင် အသုံးပြုနေပါသည် (Already In Use)';
      } else if (lower.indexOf('not found') !== -1 || lower.indexOf('invalid username') !== -1) {
        el.textContent = 'ဘောင်ချာကုဒ် မှားယွင်းနေပါသည် (Invalid Voucher Code) – ပြန်လည်စစ်ဆေးပေးပါ';
      }
    })();
  </script>
</body>
</html>
