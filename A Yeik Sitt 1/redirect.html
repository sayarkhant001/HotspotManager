<!DOCTYPE html>
<html lang="my">
<head>
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
  <title>အရိပ်စစ် Wifi – အင်တာနက် လမ်းကြောင်းလွှဲနေပါသည်...</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta http-equiv="refresh" content="2; url=$(link-redirect)" />
  <link rel="icon" type="image/jpeg" href="img/ayeiksitt.jpg" />
  <link rel="stylesheet" href="css/style.css" />
  <script>
    function startRedirect() {
      window.location.href = "$(link-redirect)";
    }
  </script>
</head>
<body onload="startRedirect()">

  <!-- Sweet Pastel Ambient Background -->
  <div class="warm-bg" aria-hidden="true">
    <div class="sun-bubble bubble-1"></div>
    <div class="sun-bubble bubble-2"></div>
  </div>

  <div class="portal-wrapper">
    <div class="portal-card" style="text-align: center;">

      <!-- Baby Hero Section -->
      <div class="hero-kid-section">
        <div class="avatar-outer-ring" style="width: 104px; height: 104px;">
          <div class="avatar-inner-frame">
            <img src="img/ayeiksitt.jpg" alt="အရိပ်စစ်လေး" class="kid-photo" />
          </div>
          <div class="kid-badge-tag">
            <span>✨</span>
            <span>ခေတ္တစောင့်ပါ</span>
          </div>
        </div>

        <h1 class="brand-title" style="font-size: 21px;">ခေတ္တစောင့်ဆိုင်းပါ</h1>
        <p class="brand-greeting">အင်တာနက် စာမျက်နှာသို့ သွားနေပါသည်...</p>
      </div>

      <a href="$(link-redirect)" class="btn-connect" style="text-decoration:none;">
        <span>ချက်ချင်း သွားမည်</span>
      </a>

      <!-- Footer Copy -->
      <p class="footer-text">
        ❤️ မေတ္တာဖြင့် ဝန်ဆောင်မှုပေးပါသည် • အရိပ်စစ် Wifi
      </p>

    </div>
  </div>

</body>
</html>
