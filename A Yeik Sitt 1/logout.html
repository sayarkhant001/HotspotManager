<!DOCTYPE html>
<html lang="my">
<head>
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
  <title>အရိပ်စစ် Wifi – လော့ဂ်အောက် ထွက်ပြီးပါပြီ</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <div class="bg-ambient">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
  </div>

  <div class="portal-container">
    <div class="glass-card" style="text-align: center;">

      <div style="width: 72px; height: 72px; border-radius: 50%; background: rgba(56, 189, 248, 0.12); border: 1.5px solid rgba(56, 189, 248, 0.35); display: inline-flex; align-items: center; justify-content: center; margin-bottom: 16px; color: #38BDF8;">
        <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
          <polyline points="16 17 21 12 16 7"/>
          <line x1="21" y1="12" x2="9" y2="12"/>
        </svg>
      </div>

      <h1 class="brand-title" style="font-size: 22px;">လော့ဂ်အောက် ထွက်ပြီးပါပြီ</h1>
      <p class="brand-subtitle" style="margin-bottom: 20px; color: var(--text-dim);">
        အင်တာနက် အသုံးပြုမှု အောင်မြင်စွာ ပြီးဆုံးပါသည်
      </p>

      <!-- Session Summary -->
      <div style="background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08); border-radius: 14px; padding: 14px 16px; margin-bottom: 20px; text-align: left;">
        <div style="display:flex; justify-content:space-between; padding: 6px 0; border-bottom: 1px solid rgba(255,255,255,0.06); font-size: 13px;">
          <span style="color:var(--text-muted);">အသုံးပြုသူအမည်:</span>
          <span style="font-weight:700; color:#FFFFFF;">$(username)</span>
        </div>
        <div style="display:flex; justify-content:space-between; padding: 6px 0; border-bottom: 1px solid rgba(255,255,255,0.06); font-size: 13px;">
          <span style="color:var(--text-muted);">စုစုပေါင်း အသုံးပြုချိန်:</span>
          <span style="font-weight:700; color:#34D399;">$(uptime)</span>
        </div>
        <div style="display:flex; justify-content:space-between; padding: 6px 0; font-size: 13px;">
          <span style="color:var(--text-muted);">အသုံးပြုခဲ့သည့် ဒေတာ:</span>
          <span style="font-weight:700; color:#38BDF8;">$(bytes-in-nice) / $(bytes-out-nice)</span>
        </div>
      </div>

      <!-- Login Again Action -->
      <form action="$(link-login)" method="get">
        <button class="btn-connect" type="submit">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <polyline points="1 4 1 10 7 10"/>
            <path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/>
          </svg>
          ပြန်လည် အသုံးပြုမည် (Login Again)
        </button>
      </form>

      <p class="footer-copy">
        အရိပ်စစ် Wifi &bull; ကျေးဇူးတင်ပါသည်
      </p>

    </div>
  </div>

</body>
</html>
