name: Build & Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Build APK
        run: ./gradlew assembleRelease --no-daemon || ./gradlew assembleDebug --no-daemon

      - name: Prepare Release APK Artifact
        run: |
          mkdir -p release-output
          TAG="${{ github.ref_name }}"
          if [ -z "$TAG" ]; then TAG="latest"; fi
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk release-output/HotspotManager-${TAG}.apk
          elif [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            cp app/build/outputs/apk/debug/app-debug.apk release-output/HotspotManager-${TAG}.apk
          fi
          cp setup.rsc release-output/setup.rsc

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: Hotspot Manager ${{ github.ref_name }}
          body: |
            ## 🚀 Hotspot Manager ${{ github.ref_name }} Update

            ### What's New:
            - ⚡ **Powerful RouterOS RSC & Command Runner**:
              - Execute RouterOS scripts and `.rsc` files directly from GitHub updates with a single tap.
              - 3-tier resilient execution engine (Script Engine -> File Import -> Line-by-Line Parser).
              - Interactive dark monospace Terminal Console in Settings with live output, command history, and quick action templates (Allow GitHub, Flush DNS, Advance Mode, Ping).
            - 🛡️ **Empowered setup.rsc & Walled Garden**:
              - Automatically allows all GitHub domains (`api.github.com`, `raw.githubusercontent.com`, `objects.githubusercontent.com`) so updates and remote scripts run smoothly before voucher login.
              - Unrestricted API session capacity (`max-sessions=30`) and all enterprise permissions enabled.
            - 🎫 **Voucher Ticket In-Box URL & Dynamic SSID**:
              - Hotspot login URL positioned strictly inside the box beneath the code.
              - Release device unbinding to allow voucher reuse across phones with remaining time/quota.
            - 🌐 **Dual Captive Portals & Real-time Metrics**:
              - Auto-syncing Access Points and Network Topology without opening the tab.
              - Live multi-device session deduplication.

            ```rsc
            # RouterOS Auto-Provisioning & Update Script
            /ip hotspot walled-garden add dst-host="*github*" comment="Allow GitHub Updates" disabled=no
            /ip hotspot walled-garden add dst-host="*raw.githubusercontent.com*" comment="Allow GitHub Raw" disabled=no
            /ip hotspot walled-garden add dst-host="*objects.githubusercontent.com*" comment="Allow GitHub CDN" disabled=no
            /ip service set api max-sessions=30 disabled=no
            /ip service set api-ssl max-sessions=30 disabled=no
            /system logging add topics=hotspot,info,account prefix="[APP]"
            :put "RouterOS successfully updated by Hotspot Manager!"
            ```
          draft: false
          prerelease: false
          files: |
            release-output/*.apk
            release-output/*.rsc
