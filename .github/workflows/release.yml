name: Build & Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Prepare Release APK Artifact
        run: |
          mkdir -p release-output
          TAG="${{ github.ref_name }}"
          if [ -z "$TAG" ]; then TAG="latest"; fi
          cp app/build/outputs/apk/debug/app-debug.apk release-output/HotspotManager-${TAG}.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: Hotspot Manager ${{ github.ref_name }}
          body: |
            ## 🚀 Hotspot Manager v${{ github.ref_name }} Update

            ### What's New:
            - 🎫 **Voucher Ticket In-Box URL & Dynamic SSID**:
              - Hotspot login URL positioned strictly **inside the box right beneath the code** (never clipped by thermal tear teeth or A4 scissors).
              - Dynamic router SSID header (`AyeikSIt_WiFi`) printed on vouchers.
              - 4-to-12 digit code auto-scaling typography with solid Excel borders.
            - 🌐 **Dual Captive Portals (`A Yeik Sitt 1` & `A Yeik Sitt 2`)**:
              - Pure Myanmar language interface.
              - Style 1 (Compact Minimalist) & Style 2 (Glassmorphism Modern).
              - Real-time traffic, remaining quota, and user notice cards (**သတင်းနှင့် အသိပေးချက်များ**).
            - 🛠️ **Dashboard Settings & In-App Updates**:
              - Direct GitHub OTA update checker and installer (Tab 2: App Updates).
              - Instant thermal printer testing, paper width toggle (58mm/80mm), and auto-cut.
              - Live Router login password changer with automatic app credential sync.
            - 🎨 **Simplified Modern App Icon**:
              - Clean, refined Wi-Fi ticket glyph with high contrast.
            - 🇲🇲 **Full Myanmar & English Dual Localization**.
          draft: false
          prerelease: false
          files: release-output/*.apk
