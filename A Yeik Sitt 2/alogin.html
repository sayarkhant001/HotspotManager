<!DOCTYPE html>
<html lang="my">
<head>
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
  <title>အရိပ်စစ် Wifi – အင်တာနက် ချိတ်ဆက်နေပါသည်...</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta http-equiv="refresh" content="2; url=$(link-status)" />
  <link rel="stylesheet" href="css/style.css" />
  <script>
    function startRedirect() {
      window.location.href = "$(link-status)";
    }
  </script>
</head>
<body onload="startRedirect()">

  <!-- Ambient Glowing Aurora Mesh -->
  <div class="aurora-bg" aria-hidden="true">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="grid-mesh"></div>
  </div>

  <div class="portal-wrapper">
    <div class="portal-card" style="text-align: center;">

      <!-- Success Beacon -->
      <div style="width: 58px; height: 58px; border-radius: 18px; background: rgba(16, 185, 129, 0.15); border: 1.5px solid rgba(16, 185, 129, 0.40); display: inline-flex; align-items: center; justify-content: center; margin-bottom: 14px; color: #34D399; box-shadow: 0 8px 24px rgba(16, 185, 129, 0.25);">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6">
          <polyline points="20 6 9 17 4 12"/>
        </svg>
      </div>

      <h1 class="brand-title" style="font-size: 19px; margin-bottom: 4px;">ချိတ်ဆက်မှု အောင်မြင်ပါသည်</h1>
      <p style="font-size: 12px; color: #A7F3D0; margin-bottom: 18px;">အင်တာနက် အသုံးပြုနိုင်ပါပြီ...</p>

      <!-- Animated Progress Glow Bar -->
      <div style="background: rgba(255,255,255,0.06); border-radius: 100px; height: 5px; overflow: hidden; margin: 18px 0;">
        <div style="height: 100%; width: 100%; background: var(--grad-primary); border-radius: 100px; animation: progressSlide 1.5s ease-in-out infinite;"></div>
      </div>

      <style>
        @keyframes progressSlide {
          0% { transform: translateX(-100%); }
          100% { transform: translateX(100%); }
        }
      </style>

      <a href="$(link-status)" class="btn-connect" style="text-decoration:none;">
        ဆက်လက် အသုံးပြုမည်
      </a>

      <p class="footer-text">
        အရိပ်စစ် Wifi &bull; Version 2.0 Next-Gen Edition
      </p>

    </div>
  </div>

</body>
</html>
