<!DOCTYPE html>
<html lang="my">
<head>
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
  <title>အရိပ်စစ် Wifi – လော့ဂ်အောက် ထွက်ပြီးပါပြီ</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <link rel="icon" type="image/jpeg" href="img/ayeiksitt.jpg" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- Sweet Pastel Ambient Background -->
  <div class="warm-bg" aria-hidden="true">
    <div class="sun-bubble bubble-1"></div>
    <div class="sun-bubble bubble-2"></div>
  </div>

  <div class="portal-wrapper">
    <div class="portal-card" style="text-align: center;">

      <!-- Baby Hero Section -->
      <div class="hero-kid-section">
        <div class="avatar-outer-ring" style="width: 104px; height: 104px;">
          <div class="avatar-inner-frame">
            <img src="img/ayeiksitt.jpg" alt="အရိပ်စစ်လေး" class="kid-photo" />
          </div>
          <div class="kid-badge-tag">
            <span>👋</span>
            <span>ကျေးဇူးတင်ပါသည်</span>
          </div>
        </div>

        <h1 class="brand-title" style="font-size: 21px;">လော့ဂ်အောက် ထွက်ပြီးပါပြီ</h1>
        <p class="brand-greeting">အင်တာနက် အသုံးပြုမှု ခေတ္တပြီးဆုံးပါသည်</p>
      </div>

      <!-- Stats Summary Card -->
      <div style="background: #FFF9F2; border: 1.5px solid var(--peach-border); border-radius: 16px; padding: 14px 16px; margin-bottom: 20px; text-align: left;">
        <div style="display:flex; justify-content:space-between; margin-bottom:8px; font-size:13px;">
          <span style="color:var(--text-muted);">အသုံးပြုသူ:</span>
          <span style="color:var(--text-title); font-weight:700; font-family:var(--font-code);">$(username)</span>
        </div>
        <div style="display:flex; justify-content:space-between; margin-bottom:8px; font-size:13px;">
          <span style="color:var(--text-muted);">အသုံးပြုချိန်:</span>
          <span style="color:#059669; font-weight:700; font-family:var(--font-code);">$(uptime)</span>
        </div>
        <div style="display:flex; justify-content:space-between; font-size:13px;">
          <span style="color:var(--text-muted);">အသုံးပြုပြီးဒေတာ:</span>
          <span style="color:var(--coral-primary); font-weight:700; font-family:var(--font-code);">$(bytes-in-nice) / $(bytes-out-nice)</span>
        </div>
      </div>

      <form action="$(link-login)" method="get">
        <button class="btn-connect" type="submit">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6">
            <polyline points="1 4 1 10 7 10"/>
            <path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/>
          </svg>
          <span>ပြန်လည် အသုံးပြုမည် (Login Again)</span>
        </button>
      </form>

      <!-- Footer Copy -->
      <p class="footer-text">
        ❤️ မေတ္တာဖြင့် ဝန်ဆောင်မှုပေးပါသည် • အရိပ်စစ် Wifi
      </p>

    </div>
  </div>

</body>
</html>
