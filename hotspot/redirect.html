<!DOCTYPE html>
<html lang="my">
<head>
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
  <title>Kyaw Gyi WiFi – လမ်းကြောင်းလွှဲနေပါသည်...</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="refresh" content="0; url=$(link-redirect)" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <style>
    *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
    html,body{height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#060913;color:#fff;
              display:flex;align-items:center;justify-content:center;}
    .wrap{text-align:center;padding:24px;}
    .ring{width:48px;height:48px;border-radius:50%;border:3px solid rgba(56,189,248,.18);
          border-top-color:#38BDF8;animation:spin .85s linear infinite;margin:0 auto 18px;}
    @keyframes spin{to{transform:rotate(360deg)}}
    p{font-size:14px;color:rgba(255,255,255,.65);font-family:'Noto Sans Myanmar',sans-serif;}
    a{color:#38BDF8;text-decoration:none;font-size:12px;display:block;margin-top:14px;}
    a:hover{text-decoration:underline;}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="ring"></div>
    <p>အင်တာနက်သို့ ချိတ်ဆက်နေပါသည်...</p>
    <a href="$(link-redirect)">အလိုအလျောက် မရောက်ရှိပါက ဤနေရာကို နှိပ်ပါ</a>
  </div>
  <script>
    (function () {
      var dest = '$(link-redirect)';
      if (!dest || dest.indexOf('$(') !== -1 || dest.trim() === '') {
        var origin = (window.location.origin && window.location.origin.startsWith('http'))
          ? window.location.origin
          : 'http://10.10.10.1';
        dest = origin + '/login';
      }
      try {
        window.location.replace(dest);
      } catch (e) {
        window.location.href = dest;
      }
    })();
  </script>
</body>
</html>
