<!DOCTYPE html>
<html lang="my">
<head>
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
  <title>ရတနာထွန်း Wifi</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%23060913'/%3E%3Cpath d='M14 24 Q32 10 50 24' stroke='%2300F2FE' stroke-width='4' fill='none' stroke-linecap='round'/%3E%3Cpath d='M20 32 Q32 20 44 32' stroke='%2338BDF8' stroke-width='3.5' fill='none' stroke-linecap='round'/%3E%3Cpolygon points='27,43 37,43 41,47 32,56 23,47' fill='%23F59E0B'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- Dynamic Ambient Animated Glow Orbs -->
  <div class="bg-ambient">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
  </div>

  <div class="portal-container">
    <div class="glass-card">
      <div class="card-glow-border"></div>

      <!-- Animated Brand Logo -->
      <div class="brand-header">
        <div class="brand-logo-wrap">
          <svg class="wifi-svg" width="46" height="46" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <linearGradient id="wifiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#00F2FE"/>
                <stop offset="60%" stop-color="#38BDF8"/>
                <stop offset="100%" stop-color="#818CF8"/>
              </linearGradient>
              <linearGradient id="gemGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#FDE68A"/>
                <stop offset="50%" stop-color="#F59E0B"/>
                <stop offset="100%" stop-color="#D97706"/>
              </linearGradient>
            </defs>
            <path class="arc arc-3" d="M12 23 Q32 7 52 23" stroke="url(#wifiGrad)" stroke-width="3.6" stroke-linecap="round" fill="none"/>
            <path class="arc arc-2" d="M19 30 Q32 18 45 30" stroke="url(#wifiGrad)" stroke-width="3.2" stroke-linecap="round" fill="none"/>
            <path class="arc arc-1" d="M26 37 Q32 30 38 37" stroke="url(#wifiGrad)" stroke-width="2.8" stroke-linecap="round" fill="none"/>
            <polygon class="gem-pulse" points="27,45 37,45 42,50 32,60 22,50" fill="url(#gemGrad)" stroke="#FEF3C7" stroke-width="1.2" stroke-linejoin="round"/>
          </svg>
        </div>
        <h1 class="brand-title">ရတနာထွန်း Wifi</h1>
        <p class="brand-sub">
          <span class="live-dot"></span>
          အင်တာနက် ချိတ်ဆက်ရန်
        </p>
      </div>

      <!-- RouterOS Form -->
      <form id="login_form" name="sendin" method="post" action="$(link-login-only)">
        <input type="hidden" name="dst" value="$(link-status)" />
        <input type="hidden" name="popup" value="false" />
        <input type="hidden" name="username" id="username_field" />
        <input type="hidden" name="password" id="password_field" value="" />

        <!-- Minimalist Pill Tabs -->
        <div class="tab-switcher" id="login_tabs">
          <button type="button" class="tab-btn active" id="tab_voucher">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
              <rect x="2" y="6" width="20" height="12" rx="3"/>
              <path d="M12 6v12M2 12h2M20 12h2"/>
            </svg>
            ဘောင်ချာ
          </button>
          <button type="button" class="tab-btn" id="tab_account">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
              <circle cx="12" cy="7" r="4"/>
            </svg>
            အကောင့်
          </button>
        </div>

        <!-- Voucher Tab Panel -->
        <div class="tab-panel" id="panel_voucher">
          <div class="input-box-wrapper">
            <input
              class="code-input-main"
              id="voucher_input"
              type="text"
              maxlength="16"
              placeholder="ဘောင်ချာကုဒ် ရိုက်ထည့်ပါ"
              autocomplete="off"
              autocorrect="off"
              autocapitalize="characters"
              spellcheck="false"
            />
            <button type="button" class="btn-icon-action" id="clear_voucher_btn" title="ဖျက်မည်" style="display:none;">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                <line x1="18" y1="6" x2="6" y2="18"/>
                <line x1="6" y1="6" x2="18" y2="18"/>
              </svg>
            </button>
            <button type="button" class="btn-icon-action" id="paste_voucher_btn" title="Paste">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/>
                <rect x="8" y="2" width="8" height="4" rx="1" ry="1"/>
              </svg>
            </button>
          </div>
        </div>

        <!-- Account Tab Panel -->
        <div class="tab-panel hide" id="panel_account">
          <div class="input-box-wrapper" style="margin-bottom: 12px;">
            <input
              class="code-input-main account-field"
              type="text"
              id="account_input"
              autocomplete="username"
              placeholder="အသုံးပြုသူအမည် (Username)"
              spellcheck="false"
            />
          </div>
          <div class="input-box-wrapper">
            <input
              class="code-input-main account-field"
              type="password"
              id="account_password"
              autocomplete="current-password"
              placeholder="လျှို့ဝှက်နံပါတ် (Password)"
            />
            <button type="button" class="btn-icon-action" id="toggle_password_btn" title="View Password">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
            </button>
          </div>
        </div>

        <!-- Error Message Alert -->
        <div class="msg-alert hide" id="login_msg">$(if error)<span>&#9888;</span> <span>$(error)</span>$(endif)</div>

        <!-- Connect Action Button -->
        <button class="btn-connect" type="submit" id="login_btn">
          <span class="btn-shimmer"></span>
          <svg class="btn-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <path d="M5 12.55a11 11 0 0 1 14.08 0"/>
            <path d="M1.42 9a16 16 0 0 1 21.16 0"/>
            <path d="M8.53 16.11a6 6 0 0 1 6.95 0"/>
            <circle cx="12" cy="20" r="1"/>
          </svg>
          <span class="btn-text">ချိတ်ဆက်မည်</span>
        </button>
      </form>

      <p class="footer-copy">
        ရတနာထွန်း Wifi &bull; High Speed Hotspot
      </p>

    </div>
  </div>

  <script src="js/main.js"></script>
</body>
</html>
