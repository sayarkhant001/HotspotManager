<!DOCTYPE html>
<html lang="my">
<head>
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
  <title>အရိပ်စစ် Wifi – အင်တာနက် အသုံးပြုရန်</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <meta name="description" content="အရိပ်စစ် Wifi – Warm & Sweet Edition" />
  <link rel="icon" type="image/jpeg" href="img/ayeiksitt.jpg" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- Sweet Pastel Ambient Background -->
  <div class="warm-bg" aria-hidden="true">
    <div class="sun-bubble bubble-1"></div>
    <div class="sun-bubble bubble-2"></div>
    <div class="sun-bubble bubble-3"></div>
  </div>

  <div class="portal-wrapper">
    <div class="portal-card">

      <!-- Adorable Baby Hero Section -->
      <div class="hero-kid-section">
        <div class="avatar-outer-ring">
          <div class="avatar-inner-frame">
            <img src="img/ayeiksitt.jpg" alt="အရိပ်စစ်လေး" class="kid-photo" />
          </div>
          <div class="kid-badge-tag">
            <span>👶</span>
            <span>အရိပ်စစ်လေး</span>
            <span style="color:#FF6B4A;">❤️</span>
          </div>
        </div>

        <h1 class="brand-title">အရိပ်စစ် Wifi</h1>
        <p class="brand-greeting">အရိပ်စစ်လေးရဲ့ နွေးထွေးသော အင်တာနက်မှ ကြိုဆိုပါတယ်</p>
        
        <div class="live-status-pill">
          <span class="live-dot"></span>
          <span>လိုင်းကောင်းမွန်နေပါသည် • မြန်နှုန်းမြင့်</span>
        </div>
      </div>

      <!--
        MikroTik Hotspot Login Form
        action = $(link-login-only)
        dst    = $(link-status)
      -->
      <form id="login_form" name="sendin" method="post" action="$(link-login-only)">
        <input type="hidden" name="dst" value="$(link-status)" />
        <input type="hidden" name="popup" value="false" />

        <!-- RouterOS Credentials Target -->
        <input type="hidden" name="username" id="username_field" />
        <input type="hidden" name="password" id="password_field" value="" />

        <!-- Segmented Tab Toggle -->
        <div class="tab-container" id="login_tabs" role="tablist">
          <button type="button" class="tab-btn active" id="tab_voucher" role="tab" aria-selected="true">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3">
              <rect x="2" y="6" width="20" height="12" rx="3"/>
              <path d="M12 6v12M2 12h2M20 12h2"/>
            </svg>
            ဘောင်ချာကုဒ်
          </button>
          <button type="button" class="tab-btn" id="tab_account" role="tab" aria-selected="false">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
              <circle cx="12" cy="7" r="4"/>
            </svg>
            အကောင့်ဖြင့်ဝင်ရန်
          </button>
        </div>

        <!-- ── Voucher Panel ── -->
        <div class="form-panel" id="panel_voucher">
          <div class="input-label-row">
            <label class="input-label" for="voucher_input">ဘောင်ချာကုဒ် ရိုက်ထည့်ပါ</label>
            <span class="input-pill-hint">၄ ~ ၁၂ လုံး</span>
          </div>

          <div class="voucher-input-box">
            <input
              class="code-input-main"
              id="voucher_input"
              type="text"
              maxlength="16"
              placeholder="ကုဒ်နံပါတ် (ဥပမာ 3799, 4930)"
              autocomplete="off"
              autocorrect="off"
              autocapitalize="characters"
              spellcheck="false"
              required
            />

            <div class="input-actions">
              <!-- Clear Action -->
              <button type="button" class="btn-input-action" id="clear_voucher_btn" title="ဖျက်မည်" style="display:none;">
                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6">
                  <line x1="18" y1="6" x2="6" y2="18"/>
                  <line x1="6" y1="6" x2="18" y2="18"/>
                </svg>
              </button>

              <!-- Paste Action -->
              <button type="button" class="btn-input-action" id="paste_voucher_btn" title="ကူးထည့်မည်">
                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
                  <path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/>
                  <rect x="8" y="2" width="8" height="4" rx="1" ry="1"/>
                </svg>
                <span>ကူးထည့်</span>
              </button>
            </div>
          </div>
        </div>

        <!-- ── Account Panel ── -->
        <div class="form-panel hide" id="panel_account">
          <div class="field-group">
            <label class="input-label" for="account_input" style="display:block; margin-bottom:6px;">အသုံးပြုသူအမည် (Username)</label>
            <input
              class="field-input"
              type="text"
              id="account_input"
              autocomplete="username"
              placeholder="အသုံးပြုသူအမည် ရိုက်ပါ"
              spellcheck="false"
            />
          </div>

          <div class="field-group" style="margin-top: 10px;">
            <label class="input-label" for="account_password" style="display:block; margin-bottom:6px;">လျှို့ဝှက်နံပါတ် (Password)</label>
            <div style="position:relative; display:flex; align-items:center;">
              <input
                class="field-input"
                type="password"
                id="account_password"
                autocomplete="current-password"
                placeholder="လျှို့ဝှက်နံပါတ် ရိုက်ပါ"
                style="padding-right: 44px;"
              />
              <button type="button" class="btn-input-action" id="toggle_password_btn" title="လျှို့ဝှက်နံပါတ် ကြည့်မည်" style="position:absolute; right:6px;">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                  <circle cx="12" cy="12" r="3"/>
                </svg>
              </button>
            </div>
          </div>
        </div>

        <!-- RouterOS Error Banner -->
        $(if error)
        <div class="alert-box" id="login_msg">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" style="flex-shrink:0;">
            <circle cx="12" cy="12" r="10"/>
            <line x1="12" y1="8" x2="12"/>
            <line x1="12" y1="16" x2="12.01" y2="16"/>
          </svg>
          <span>$(error)</span>
        </div>
        $(endif)

        <!-- Primary Connect Button -->
        <button class="btn-connect" type="submit" id="login_btn">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6">
            <path d="M5 12.55a11 11 0 0 1 14.08 0"/>
            <path d="M1.42 9a16 16 0 0 1 21.16 0"/>
            <path d="M8.53 16.11a6 6 0 0 1 6.95 0"/>
            <circle cx="12" cy="20" r="1"/>
          </svg>
          <span>အင်တာနက် စတင်အသုံးပြုမည်</span>
        </button>
      </form>

      <!-- Footer Copy -->
      <p class="footer-text">
        ❤️ မေတ္တာဖြင့် ဝန်ဆောင်မှုပေးပါသည် • အရိပ်စစ် Wifi
      </p>

    </div>
  </div>

  <script src="js/main.js"></script>
</body>
</html>
