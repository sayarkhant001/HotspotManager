<!DOCTYPE html>
<html lang="my">
<head>
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
  <title>ရတနာထွန်း Wifi – အခြေအနေ</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <meta http-equiv="refresh" content="60; url=$(link-status)" />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%23060913'/%3E%3Cpath d='M14 24 Q32 10 50 24' stroke='%2300F2FE' stroke-width='4' fill='none' stroke-linecap='round'/%3E%3Cpath d='M20 32 Q32 20 44 32' stroke='%2338BDF8' stroke-width='3.5' fill='none' stroke-linecap='round'/%3E%3Cpolygon points='27,43 37,43 41,47 32,56 23,47' fill='%23F59E0B'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- Dynamic Ambient Animated Glow Orbs -->
  <div class="bg-ambient">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
  </div>

  <div class="portal-container">
    <div class="glass-card" style="text-align: center;">

      <!-- Brand Header -->
      <div class="brand-header" style="margin-bottom: 18px;">
        <h1 class="brand-title">ရတနာထွန်း Wifi</h1>
        <p class="brand-sub">
          <span class="live-dot"></span>
          အင်တာနက် ချိတ်ဆက်ထားသည်
        </p>
      </div>

      <!-- Active User Card -->
      <div style="background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 16px; padding: 12px 16px; margin-bottom: 16px; text-align: left; display: flex; align-items: center; gap: 12px;">
        <div style="width: 38px; height: 38px; border-radius: 12px; background: rgba(56, 189, 248, 0.15); display: flex; align-items: center; justify-content: center; color: #38BDF8;">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
            <circle cx="12" cy="7" r="4"/>
          </svg>
        </div>
        <div>
          <div style="font-size: 11px; color: var(--text-dim); font-weight: 500;">အသုံးပြုသူ</div>
          <div style="font-size: 15px; font-weight: 700; color: #FFFFFF;" id="display_username">$(username)</div>
        </div>
      </div>

      <!-- Live Session Stats 2x2 -->
      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 16px;">
        <div style="background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08); border-radius: 14px; padding: 12px; text-align: left;">
          <div style="font-size: 11px; color: var(--text-dim);">အသုံးပြုချိန်</div>
          <div style="font-size: 14px; font-weight: 700; color: #10B981; margin-top: 2px;" id="stat_uptime">$(uptime)</div>
        </div>

        <div style="background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08); border-radius: 14px; padding: 12px; text-align: left;">
          <div style="font-size: 11px; color: var(--text-dim);">ကျန်ရှိချိန်</div>
          <div style="font-size: 14px; font-weight: 700; color: #F59E0B; margin-top: 2px;" id="stat_timeleft">$(session-time-left)</div>
        </div>

        <div style="background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08); border-radius: 14px; padding: 12px; text-align: left;">
          <div style="font-size: 11px; color: var(--text-dim);">အသုံးပြုပြီး</div>
          <div style="font-size: 14px; font-weight: 700; color: #38BDF8; margin-top: 2px;" id="stat_data_used">$(bytes-in-nice) / $(bytes-out-nice)</div>
        </div>

        <div style="background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08); border-radius: 14px; padding: 12px; text-align: left;">
          <div style="font-size: 11px; color: var(--text-dim);">ကျန်ရှိဒေတာ</div>
          <div style="font-size: 14px; font-weight: 700; color: #A7F3D0; margin-top: 2px;" id="stat_data_remaining">$(remain-bytes-total)</div>
        </div>
      </div>

      <!-- IP & MAC -->
      <div style="font-size: 11px; color: var(--text-dim); margin-bottom: 16px;">
        IP: <span style="color:#E2E8F0;">$(ip)</span> &bull; MAC: <span style="color:#E2E8F0;">$(mac)</span>
      </div>

      <!-- Logout Form -->
      <form action="$(link-logout)" name="logout" method="post">
        <input type="hidden" name="erase-cookie" value="on" />
        <button type="submit" style="width: 100%; padding: 13px; border: 1px solid rgba(239, 68, 68, 0.4); border-radius: 14px; background: rgba(239, 68, 68, 0.12); color: #FCA5A5; font-family: inherit; font-size: 14px; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px;">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
            <polyline points="16 17 21 12 16 7"/>
            <line x1="21" y1="12" x2="9" y2="12"/>
          </svg>
          ထွက်မည် (Logout)
        </button>
      </form>

      <p class="footer-copy">
        ရတနာထွန်း Wifi &bull; High Speed Hotspot
      </p>

    </div>
  </div>

  <script src="js/main.js"></script>
  <script>
    (function() {
      function formatBytesToMB(val) {
        if (!val) return 'Unlimited';
        var s = String(val).trim();
        if (!s || s.indexOf('$(') !== -1 || s.toLowerCase() === 'unlimited' || s.toLowerCase() === 'none') {
          return 'Unlimited';
        }
        var m = s.match(/([0-9]+(?:\.[0-9]+)?)\s*([a-zA-Z]+)?/);
        if (!m) return s;
        var num = parseFloat(m[1]);
        if (isNaN(num)) return s;
        if (num === 0) return '0 MB';
        var unit = (m[2] || '').toLowerCase();
        var mb = 0;
        if (unit.indexOf('g') !== -1) {
          mb = num * 1024;
        } else if (unit.indexOf('m') !== -1) {
          mb = num;
        } else if (unit.indexOf('k') !== -1) {
          mb = num / 1024;
        } else if (unit === 'b' || unit === 'byte' || unit === 'bytes') {
          mb = num / (1024 * 1024);
        } else {
          if (num > 10000) {
            mb = num / (1024 * 1024);
          } else {
            mb = num;
          }
        }
        if (mb >= 100) {
          return (Math.round(mb * 10) / 10).toLocaleString() + ' MB';
        } else if (mb >= 1) {
          return (Math.round(mb * 100) / 100).toFixed(1) + ' MB';
        } else if (mb > 0) {
          var f = (Math.round(mb * 100) / 100).toFixed(2);
          return (f === '0.00' ? '< 0.01' : f) + ' MB';
        } else {
          return '0 MB';
        }
      }
      var remEl = document.getElementById('stat_data_remaining');
      if (remEl) {
        remEl.textContent = formatBytesToMB(remEl.textContent);
      }
    })();
  </script>
</body>
</html>
