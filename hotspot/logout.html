<!DOCTYPE html>
<html lang="my">
<head>
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
  <title>အရိပ်စစ် Wifi – လော့ဂ်အောက် ထွက်ပြီးပါပြီ</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- Ambient Glowing Aurora Mesh -->
  <div class="aurora-bg" aria-hidden="true">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="grid-mesh"></div>
  </div>

  <div class="portal-wrapper">
    <div class="portal-card" style="text-align: center;">

      <!-- Logout Icon Badge -->
      <div style="width: 58px; height: 58px; border-radius: 18px; background: rgba(0, 242, 254, 0.15); border: 1.5px solid rgba(0, 242, 254, 0.40); display: inline-flex; align-items: center; justify-content: center; margin-bottom: 14px; color: var(--cyan); box-shadow: 0 8px 24px rgba(0, 242, 254, 0.25);">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
          <polyline points="16 17 21 12 16 7"/>
          <line x1="21" y1="12" x2="9" y2="12"/>
        </svg>
      </div>

      <h1 class="brand-title" style="font-size: 19px; margin-bottom: 4px;">လော့ဂ်အောက် ထွက်ပြီးပါပြီ</h1>
      <p style="font-size: 12px; color: var(--text-muted); margin-bottom: 16px;">အင်တာနက် အသုံးပြုမှု ပြီးဆုံးပါသည်</p>

      <!-- Stats Summary -->
      <div style="background: rgba(8, 13, 24, 0.85); border: 1px solid rgba(255, 255, 255, 0.10); border-radius: 14px; padding: 14px; margin-bottom: 18px; text-align: left;">
        <div style="display:flex; justify-content:space-between; margin-bottom:8px; font-size:12.5px;">
          <span style="color:var(--text-muted);">အသုံးပြုသူ:</span>
          <span style="color:#FFFFFF; font-weight:700; font-family:var(--font-code);">$(username)</span>
        </div>
        <div style="display:flex; justify-content:space-between; margin-bottom:8px; font-size:12.5px;">
          <span style="color:var(--text-muted);">အသုံးပြုချိန်:</span>
          <span style="color:#34D399; font-weight:700; font-family:var(--font-code);">$(uptime)</span>
        </div>
        <div style="display:flex; justify-content:space-between; font-size:12.5px;">
          <span style="color:var(--text-muted);">အသုံးပြုပြီးဒေတာ:</span>
          <span style="color:var(--cyan); font-weight:700; font-family:var(--font-code);">$(bytes-in-nice) / $(bytes-out-nice)</span>
        </div>
      </div>

      <form action="$(link-login)" method="get">
        <button class="btn-connect" type="submit">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6">
            <polyline points="1 4 1 10 7 10"/>
            <path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/>
          </svg>
          ပြန်လည် အသုံးပြုမည် (Login Again)
        </button>
      </form>

      <p class="footer-text">
        အရိပ်စစ် Wifi &bull; ကျေးဇူးတင်ပါသည်
      </p>

    </div>
  </div>

</body>
</html>
