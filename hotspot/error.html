<!DOCTYPE html>
<html lang="my">
<head>
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
  <title>အရိပ်စစ် Wifi – ချိတ်ဆက်မှု မအောင်မြင်ပါ</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <div class="compact-wrapper">
    <div class="compact-card" style="text-align: center;">

      <div style="width: 54px; height: 54px; border-radius: 50%; background: rgba(244, 63, 94, 0.15); border: 1.5px solid rgba(244, 63, 94, 0.40); display: inline-flex; align-items: center; justify-content: center; margin-bottom: 12px; color: #FB7185;">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10"/>
          <line x1="12" y1="8" x2="12" y2="12"/>
          <line x1="12" y1="16" x2="12.01" y2="16"/>
        </svg>
      </div>

      <h1 class="compact-title" style="font-size: 18px; margin-bottom: 4px;">ချိတ်ဆက်မှု မအောင်မြင်ပါ</h1>
      <p style="font-size: 12px; color: #FDA4AF; margin-bottom: 16px;">အချက်အလက် မှားယွင်းနေပါသည်</p>

      <div style="background: rgba(244, 63, 94, 0.10); border: 1px solid rgba(244, 63, 94, 0.25); border-radius: 12px; padding: 12px 14px; margin-bottom: 18px; color: #FECDD3; font-size: 13px; line-height: 1.5;">
        $(error)
        <div style="margin-top: 6px; font-size: 11.5px; color: var(--text-muted);">
          ကုဒ်နံပါတ် ၄ မှ ၁၂ လုံး ကို ပြန်လည် စစ်ဆေးပေးပါ
        </div>
      </div>

      <form action="$(link-login)" method="get">
        <button class="btn-submit-compact" type="submit">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <polyline points="1 4 1 10 7 10"/>
            <path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/>
          </svg>
          ပြန်လည် ကြိုးစားမည် (Try Again)
        </button>
      </form>

      <p class="copy-compact">
        အရိပ်စစ် Wifi &bull; ဆိုင်သို့ ဆက်သွယ်မေးမြန်းနိုင်ပါသည်
      </p>

    </div>
  </div>

</body>
</html>
