<!DOCTYPE html>
<html lang="my">
<head>
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
  <title>Kyaw Gyi WiFi – အမှားအယွင်း (Error)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- Ambient Animated Aurora -->
  <div class="bg-ambient">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
  </div>

  <div class="portal-container">
    <div class="glass-card">

      <div class="brand-header">
        <div class="brand-badge" style="border-color: rgba(239, 68, 68, 0.45); box-shadow: 0 8px 24px rgba(239, 68, 68, 0.25);">
          <svg class="wifi-wave-icon" viewBox="0 0 24 24" fill="none" stroke="#EF4444" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"/>
            <line x1="12" y1="8" x2="12" y2="12"/>
            <line x1="12" y1="16" x2="12.01" y2="16"/>
          </svg>
        </div>
        <h1 class="brand-title">ချိတ်ဆက်မှု မအောင်မြင်ပါ</h1>
        <div class="brand-subtitle">
          <span style="color: #F87171;">အမှားအယွင်း ဖြစ်ပေါ်ခဲ့သည်</span>
        </div>
      </div>

      <!-- Error Message Box -->
      <div class="alert-box" style="margin-bottom: 20px;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="flex-shrink:0;">
          <circle cx="12" cy="12" r="10"/>
          <line x1="12" y1="8" x2="12" y2="12"/>
          <line x1="12" y1="16" x2="12.01" y2="16"/>
        </svg>
        <span>$(error)</span>
      </div>

      <!-- Retry Back Button -->
      <a href="$(link-login)" style="text-decoration:none;">
        <button type="button" class="btn-submit">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
            <polyline points="1 4 1 10 7 10"/>
            <path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/>
          </svg>
          ပြန်လည် ကြိုးစားမည် (Try Again)
        </button>
      </a>

      <p class="footer-note">
        Kyaw Gyi WiFi &bull; ပြဿနာရှိပါက ဆိုင်ရှင်ထံ ဆက်သွယ်ပါ
      </p>

    </div>
  </div>

</body>
</html>
