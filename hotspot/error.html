<!DOCTYPE html>
<html lang="my">
<head>
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
  <title>Kyaw Gyi WiFi – ချိတ်ဆက်မှု မအောင်မြင်ပါ</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <link rel="stylesheet" href="css/style.css" />
  <script>
    try {
      localStorage.clear();
      sessionStorage.clear();
    } catch(e) {}
  </script>
</head>
<body>

  <div class="bg-ambient">
    <div class="orb orb-1" style="background: radial-gradient(circle, #EF4444, #F97316);"></div>
  </div>

  <div class="portal-container">
    <div class="glass-card" style="text-align: center;">

      <div style="width: 72px; height: 72px; border-radius: 50%; background: rgba(239, 68, 68, 0.15); border: 1.5px solid rgba(239, 68, 68, 0.40); display: inline-flex; align-items: center; justify-content: center; margin-bottom: 16px; color: #F87171;">
        <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10"/>
          <line x1="12" y1="8" x2="12" y2="12"/>
          <line x1="12" y1="16" x2="12.01" y2="16"/>
        </svg>
      </div>

      <h1 class="brand-title" style="font-size: 22px;">ချိတ်ဆက်မှု မအောင်မြင်ပါ</h1>
      <p class="brand-sub" style="margin-bottom: 20px; color: #FCA5A5;">
        $(if error)$(error)$(else)အချက်အလက် မှားယွင်းနေပါသည် သို့မဟုတ် ဒေတာ/သက်တမ်း ကုန်ဆုံးပါပြီ$(endif)
      </p>

      <div style="background: rgba(239, 68, 68, 0.12); border: 1px solid rgba(239, 68, 68, 0.30); border-radius: 14px; padding: 14px 16px; margin-bottom: 22px; color: #FECACA; font-size: 13.5px; line-height: 1.6;">
        ဘောင်ချာကုဒ် သက်တမ်း သို့မဟုတ် ဒေတာကုန်သွားပါက ဘောင်ချာအသစ် ဝယ်ယူထည့်သွင်းပေးပါရန်
      </div>

      <form action="$(link-login)" method="get">
        <button class="btn-connect" type="submit">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <polyline points="1 4 1 10 7 10"/>
            <path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/>
          </svg>
          ဘောင်ချာအသစ် ထည့်မည် (Login Again)
        </button>
      </form>

      <p class="footer-copy">
        Kyaw Gyi WiFi &bull; စိတ်ချယုံကြည်ရသော ဝန်ဆောင်မှု
      </p>

    </div>
  </div>

</body>
</html>
