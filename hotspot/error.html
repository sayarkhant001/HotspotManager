<!DOCTYPE html>
<html lang="my">
<head>
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
  <title>အရိပ်စစ် Wifi – ချိတ်ဆက်မှု မအောင်မြင်ပါ</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- Ambient Glowing Aurora Mesh -->
  <div class="aurora-bg" aria-hidden="true">
    <div class="orb orb-1" style="background: radial-gradient(circle, #F43F5E 0%, rgba(244,63,94,0) 70%);"></div>
    <div class="orb orb-2"></div>
    <div class="grid-mesh"></div>
  </div>

  <div class="portal-wrapper">
    <div class="portal-card" style="text-align: center;">

      <!-- Error Icon Badge -->
      <div style="width: 58px; height: 58px; border-radius: 18px; background: rgba(244, 63, 94, 0.15); border: 1.5px solid rgba(244, 63, 94, 0.40); display: inline-flex; align-items: center; justify-content: center; margin-bottom: 14px; color: #FB7185; box-shadow: 0 8px 24px rgba(244, 63, 94, 0.25);">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
          <circle cx="12" cy="12" r="10"/>
          <line x1="12" y1="8" x2="12" y2="12"/>
          <line x1="12" y1="16" x2="12.01" y2="16"/>
        </svg>
      </div>

      <h1 class="brand-title" style="font-size: 19px; margin-bottom: 4px;">ချိတ်ဆက်မှု မအောင်မြင်ပါ</h1>
      <p style="font-size: 12px; color: #FDA4AF; margin-bottom: 16px;">အချက်အလက် မှားယွင်းနေပါသည်</p>

      <div style="background: rgba(244, 63, 94, 0.10); border: 1px solid rgba(244, 63, 94, 0.25); border-radius: 14px; padding: 12px 14px; margin-bottom: 18px; color: #FECDD3; font-size: 13px; line-height: 1.5; text-align: left;">
        <div style="font-weight: 700; margin-bottom: 4px; display:flex; align-items:center; gap:6px;">
          <span>⚠️</span>
          <span>$(error)</span>
        </div>
        <div style="font-size: 11.5px; color: var(--text-muted); line-height: 1.4;">
          ဘောင်ချာကုဒ် ၄ လုံးမှ ၁၂ လုံးကို မှန်ကန်စွာ ရိုက်ထည့်ထားခြင်း ရှိမရှိ ပြန်လည်စစ်ဆေးပေးပါ။
        </div>
      </div>

      <form action="$(link-login)" method="get">
        <button class="btn-connect" type="submit">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6">
            <polyline points="1 4 1 10 7 10"/>
            <path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/>
          </svg>
          ပြန်လည် ကြိုးစားမည် (Try Again)
        </button>
      </form>

      <p class="footer-text">
        အရိပ်စစ် Wifi &bull; Version 2.0 Next-Gen Edition
      </p>

    </div>
  </div>

</body>
</html>
