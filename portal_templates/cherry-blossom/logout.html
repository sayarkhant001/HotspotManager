<!DOCTYPE html>
<html lang="my">
<head>
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
  <title>Free WiFi – Logged Out</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <style>
:root{--bg:#831843;--card:rgba(131, 24, 67, 0.78);--border:rgba(236, 72, 153, 0.35);--acc:#EC4899;--grad:linear-gradient(135deg, #EC4899 0%, #DB2778 100%);--txt:#FFFFFF;--muted:#FBCFE8;--font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans Myanmar",sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100vh;font-family:var(--font);background:var(--bg);color:var(--txt);display:flex;align-items:center;justify-content:center;position:relative}
.glass{width:100%;max-width:430px;padding:18px 16px;margin:auto}
.card{background:var(--card);backdrop-filter:blur(24px);border:1px solid var(--border);border-radius:20px;padding:28px 22px;text-align:center;box-shadow:0 24px 60px rgba(0,0,0,.45)}
.badge{width:74px;height:74px;border-radius:50%;background:rgba(251,191,36,.13);border:1.5px solid rgba(251,191,36,.5);display:inline-flex;align-items:center;justify-content:center;margin-bottom:14px;color:#FBBF24}
.badge svg{width:34px;height:34px}
h1{font-size:19px;margin-bottom:6px}
p{color:var(--muted);font-size:13px;line-height:1.6;margin-bottom:20px}
.btn{display:inline-block;width:100%;padding:14px;border:none;border-radius:13px;font-size:14.5px;font-weight:700;font-family:inherit;color:#fff;background:var(--grad);text-decoration:none}
.footer{text-align:center;color:var(--muted);font-size:11px;margin-top:16px}
</style>
</head>
<body>
  <div class="glass">
    <div class="card">
      <div class="badge"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg></div>
      <h1>ထွက်ပြီးပါပြီ (Disconnected)</h1>
      <p>အင်တာနက်အသုံးပြုမှု ရပ်ဆိုင်းပြီးပါပြီ။<br/>နောက်တစ်ကြိမ် ဆက်သွယ်ရန် ဘောင်ချာအသစ် ရိုက်ထည့်ပါ။</p>
      <a class="btn" href="$(link-login)">🔗 ပြန်လည်ချိတ်ဆက်မည် (Reconnect)</a>
      <div class="footer">Free WiFi · HotspotManager Theme</div>
    </div>
  </div>
</body>
</html>
