<!DOCTYPE html>
<html lang="my">
<head>
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
  <title>Free WiFi – Error</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <style>
:root{--bg:#7C2D12;--card:rgba(124, 45, 18, 0.78);--border:rgba(249, 115, 22, 0.35);--grad:linear-gradient(135deg, #F97316 0%, #EA580C 100%);--txt:#FFFFFF;--muted:#FDBA74;--font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans Myanmar",sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100vh;font-family:var(--font);background:var(--bg);color:var(--txt);display:flex;align-items:center;justify-content:center}
.glass{width:100%;max-width:430px;padding:18px 16px;margin:auto}
.card{background:var(--card);backdrop-filter:blur(24px);border:1px solid rgba(239,68,68,.4);border-radius:20px;padding:28px 22px;text-align:center;box-shadow:0 24px 60px rgba(0,0,0,.45)}
.badge{width:74px;height:74px;border-radius:50%;background:rgba(239,68,68,.13);border:1.5px solid rgba(239,68,68,.5);display:inline-flex;align-items:center;justify-content:center;margin:0 auto 14px;color:#F87171}
.badge svg{width:34px;height:34px}
h1{font-size:18px;margin-bottom:6px}
p{color:var(--muted);font-size:13px;margin-bottom:20px;line-height:1.65}
.btn{display:inline-block;width:100%;padding:14px;border:none;border-radius:13px;font-size:14.5px;font-weight:700;color:#fff;background:var(--grad);text-decoration:none}
.footer{text-align:center;color:var(--muted);font-size:11px;margin-top:16px}
</style>
</head>
<body>
  <div class="glass">
    <div class="card">
      <div class="badge"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg></div>
      <h1>ချိတ်ဆက်၍မရပါ (Connection Problem)</h1>
      <p>$(error-orig)</p>
      <a class="btn" href="$(link-login)">🔁 ပြန်ကြိုးစားမည် (Try Again)</a>
      <div class="footer">Free WiFi · HotspotManager Theme</div>
    </div>
  </div>
</body>
</html>
