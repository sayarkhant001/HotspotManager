<!DOCTYPE html>
<html lang="en">
<head>
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
  <title>Yadanar Tun Wifi – Connected!</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <meta name="description" content="Yadanar Tun Wifi – Login successful. You are now connected." />
  <!--
    alogin.html – After-login success page.
  -->
  <meta http-equiv="refresh" content="3; url=$(link-status)" />
  <link rel="icon" href="img/favicon.ico" />
  <link rel="stylesheet" href="css/style.css" />
  <style>
    /* ── Success Page Extras ── */
    .success-icon-wrap {
      display: flex; justify-content: center; margin-bottom: 20px;
    }
    .success-circle {
      width: 80px; height: 80px; border-radius: 50%;
      background: radial-gradient(circle at 40% 35%, #0f3a22, #061a10);
      border: 2px solid rgba(74,222,128,.55);
      box-shadow: 0 0 0 6px rgba(74,222,128,.10), 0 0 32px rgba(74,222,128,.25);
      display: flex; align-items: center; justify-content: center;
      animation: pop-in .5s cubic-bezier(.22,1,.36,1) both;
    }
    @keyframes pop-in {
      from { transform: scale(.6); opacity: 0; }
      to   { transform: scale(1);  opacity: 1; }
    }
    .success-check {
      animation: check-draw .6s ease .3s both;
    }
    @keyframes check-draw {
      from { stroke-dashoffset: 40; opacity: 0; }
      to   { stroke-dashoffset: 0;  opacity: 1; }
    }
    .success-check path {
      stroke-dasharray: 40;
      stroke-dashoffset: 40;
      animation: check-draw .5s ease .4s forwards;
    }
    .success-title {
      text-align: center;
      font-size: 26px; font-weight: 800; letter-spacing: .05em;
      color: #4ade80; margin-bottom: 6px;
    }
    .success-sub {
      text-align: center;
      font-size: 13px; color: rgba(255,255,255,.50);
      margin-bottom: 22px;
    }
    .redirect-bar-wrap {
      margin: 20px 0 8px;
      background: rgba(255,255,255,.06);
      border-radius: 100px;
      height: 4px; overflow: hidden;
    }
    .redirect-bar {
      height: 100%; width: 0%;
      background: linear-gradient(90deg, #d4940a, #ffe083);
      border-radius: 100px;
      animation: fill-bar 3s linear forwards;
    }
    @keyframes fill-bar { to { width: 100%; } }
    .redirect-note {
      text-align: center; font-size: 11px;
      color: rgba(255,255,255,.30); margin-top: 6px;
    }
    .redirect-note a {
      color: var(--gold-mid); text-decoration: none;
    }
    .redirect-note a:hover { text-decoration: underline; }
    .user-greeting {
      background: rgba(74,222,128,.07);
      border: 1px solid rgba(74,222,128,.20);
      border-radius: 12px;
      padding: 12px 18px; margin-bottom: 16px;
      text-align: center;
    }
    .user-greeting-label {
      font-size: 10px; letter-spacing: .10em;
      color: rgba(74,222,128,.60); text-transform: uppercase;
      font-weight: 600; margin-bottom: 4px;
    }
    .user-greeting-value {
      font-size: 18px; font-weight: 700; letter-spacing: .12em;
      color: #4ade80; word-break: break-all;
    }
  </style>
</head>
<body>

  <!-- Loading Overlay -->
  <div class="body-loading" id="body_loading">
    <div class="loading-inner">
      <div class="loading-ring"></div>
      <p class="loading-text">Connecting…</p>
    </div>
  </div>

  <div class="body-wrapper">

    <div class="body-background">
      <div class="body-background-mask"></div>
    </div>

    <div class="particles" aria-hidden="true">
      <span></span><span></span><span></span>
      <span></span><span></span><span></span><span></span>
    </div>

    <div class="body-content-wrapper">
      <div class="login-card">

        <!-- Success Icon -->
        <div class="success-icon-wrap">
          <div class="success-circle">
            <svg class="success-check" width="38" height="38" viewBox="0 0 38 38" fill="none"
                 xmlns="http://www.w3.org/2000/svg">
              <path d="M9 20 L16 27 L29 11"
                    stroke="#4ade80" stroke-width="3"
                    stroke-linecap="round" stroke-linejoin="round"
                    fill="none"/>
            </svg>
          </div>
        </div>

        <!-- Title -->
        <h1 class="success-title">CONNECTED!</h1>
        <p class="success-sub">Login successful. Welcome to Yadanar Tun Wifi (ရတနာထွန်း).</p>

        <!--
          MikroTik: $(username) is the authenticated user / voucher.
        -->
        <div class="user-greeting">
          <p class="user-greeting-label">Logged in as</p>
          <p class="user-greeting-value">$(username)</p>
        </div>

        <!-- Auto-redirect progress bar (3 seconds) -->
        <div class="redirect-bar-wrap">
          <div class="redirect-bar"></div>
        </div>
        <p class="redirect-note">
          Opening your session dashboard…&nbsp;
          <a href="$(link-status)" id="redirect_now_link">Click here</a> if not redirected.
        </p>

        <!-- Action Button -->
        <a class="connect-btn" href="$(link-status)" id="status_now_btn"
           style="display:flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;margin-top:16px;margin-bottom:12px;">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
            <line x1="3" y1="9" x2="21" y2="9"/>
            <line x1="9" y1="21" x2="9" y2="9"/>
          </svg>
          OPEN DASHBOARD
        </a>

        <!-- Feature tags -->
        <div class="feature-row">
          <span class="feature-tag">&#10022; HIGH SPEED</span>
          <span class="feature-tag">&#10022; STABLE LINK</span>
          <span class="feature-tag">&#10022; 24/7 UP TIME</span>
        </div>

        <p class="card-footer">
          Yadanar Tun Wifi &nbsp;&bull;&nbsp; Powered by MikroTik
        </p>

      </div><!-- /.login-card -->
    </div>

  </div><!-- /.body-wrapper -->

  <script>
    (function () {
      setTimeout(function () {
        var overlay = document.getElementById('body_loading');
        if (overlay) overlay.classList.add('hide');
      }, 500);

      var statusTarget = '$(link-status)';
      if (!statusTarget || statusTarget.indexOf('$') !== -1) {
        statusTarget = (window.location.origin && window.location.origin.startsWith('http'))
          ? window.location.origin + '/status'
          : 'http://10.10.10.1/status';
      }

      /* Ensure status links always point to valid status target */
      var redirectLink = document.getElementById('redirect_now_link');
      if (redirectLink) redirectLink.setAttribute('href', statusTarget);
      var statusBtn = document.getElementById('status_now_btn');
      if (statusBtn) statusBtn.setAttribute('href', statusTarget);

      /* JavaScript 3-second redirect fallback */
      var timer = setTimeout(function () {
        window.location.href = statusTarget;
      }, 3000);

      if (statusBtn) {
        statusBtn.addEventListener('click', function () {
          clearTimeout(timer);
        });
      }
    })();
  </script>
</body>
</html>
